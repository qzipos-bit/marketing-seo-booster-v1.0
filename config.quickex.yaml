# Автоскан Quickex — 3 раза в день по Москве
scan:
  cron:
    timezone: Europe/Moscow
    times:
      - "07:00"
      - "12:00"
      - "21:00"
  mandatory_pages:
    enabled: true
    file: data/quickex/mandatory-exchange-pages.txt
  checklist_concurrency: 8
  seo_concurrency: 12
