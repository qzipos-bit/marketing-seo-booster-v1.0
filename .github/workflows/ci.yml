name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  SCAN_INTERVAL_MIN: "0"
  SCAN_CRON_TIMES: "off"
  AUTO_CHECK_INTERVAL_MIN: "0"
  SCAN_SKIP_AI_REVIEW: "true"
  MONITOR_API_TOKEN: ""
  CONFIG_PROFILE: quickex

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t msb:test .
